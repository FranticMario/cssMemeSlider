<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dark Website</title>
</head>
<body>

    <header class="header">
        <div class="wrapper">
            <h1 class="header__titel">CSS Meme Slider </h1>
           
        </div>
    </header>


    <main class="main">
        <div class="wrapper">
            <div class="slider__wrapper meme-wrapper">
                <input type="radio" name="r" id="r1" checked>
                <input type="radio" name="r" id="r2" >
                <input type="radio" name="r" id="r3" >
                <input type="radio" name="r" id="r4" >

           
                <div class="slider middle">
                    <div class="slides">
                        <div class="slide"><img src="./img/gif/cat.gif" alt=""></div>
                        <div class="slide"><img src="./img/gif/lion.gif" alt=""></div>
                        <div class="slide"><img src="./img/gif/rick.gif" alt=""></div>
                        <div class="slide"><img src="./img/gif/sigma.gif" alt=""></div>
                    </div> 
                </div>
                <div class="content">
                    <div class="meme__titel titel">
                        <div class="titel__wrapper">
                            <div class="title__text">I'am Programmer</div>
                            <div class="title__text">Three-point</div>
                            <div class="title__text">Say hello, Morty!</div>
                            <div class="title__text">Too sigma for you</div>
                        </div>               
                    </div>
               
                    <div class="navigation">
                        <label for="r1" class="bar"></label>
                        <label for="r2" class="bar"></label>
                        <label for="r3" class="bar"></label>
                        <label for="r4" class="bar"></label>
                    </div>
                </div>
         
            </div>
        </div>

    </main>


</body>
</html>
